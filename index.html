<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte SEAL — Redes Sociales</title>
<meta name="description" content="Resultados mensuales en redes sociales de SEAL Internacional.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo-seal.png">
<style>
@font-face{font-family:"Anton";font-weight:400;font-display:swap;src:url(assets/fonts/anton.ttf) format("truetype")}
@font-face{font-family:"Jakarta";font-weight:400;font-display:swap;src:url(assets/fonts/jakarta-400.ttf) format("truetype")}
@font-face{font-family:"Jakarta";font-weight:600;font-display:swap;src:url(assets/fonts/jakarta-600.ttf) format("truetype")}
@font-face{font-family:"Jakarta";font-weight:800;font-display:swap;src:url(assets/fonts/jakarta-800.ttf) format("truetype")}

:root{
  --bg:#F6F4FA; --card:#FFFFFF; --ink:#1A1630; --muted:#6E6A85; --line:#ECE8F2; --soft:#F7F5FB;
  --rosa:#FBD9EA; --rosa-ink:#8A1257; --rosa-s:#E88BB8;
  --azul:#0B5FAE; --azul-bg:#D8E7F7; --azul-ink:#0A4172; --azul-s:#7BAEDC;
  --verde:#DCF0D0; --verde-ink:#2A5E1C; --verde-s:#8FCB6E;
  --up:#2F7D34; --up-bg:#E4F2E1;
  --sh:0 1px 2px rgba(26,22,48,.04),0 10px 30px rgba(26,22,48,.06);
  --sh-h:0 6px 14px rgba(26,22,48,.07),0 22px 50px rgba(26,22,48,.13);
  --r:20px; --ease:cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Jakarta",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:clamp(16px,3vw,34px)}
h1,h2,h3,p{margin:0} img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px}
.disp{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.u{font-size:.55em;letter-spacing:0}

.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;
  transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh-h)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s3{grid-column:span 6}}
@media (max-width:1000px){.s8,.s7{grid-column:span 12}.s5,.s4{grid-column:span 6}}
@media (max-width:700px){.s12,.s8,.s7,.s5,.s4,.s3{grid-column:span 12}}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes up{from{transform:scaleY(0)}}
.anim>*{animation:rise .5s var(--ease) backwards}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}
.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}.anim>*:nth-child(n+7){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card:hover{transform:none}}

/* Barra superior */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 24px}
.top .id{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 420px}
.top .id img{width:60px;height:60px;flex:none}
.top h1{font-size:clamp(19px,2.4vw,26px)}
.top .sub{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;max-width:70ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:#EEEAF4;padding:5px;border-radius:22px}
.tabs button{font:800 13px "Jakarta";border:0;cursor:pointer;padding:9px 16px;border-radius:99px;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--azul);box-shadow:0 1px 3px rgba(26,22,48,.14)}
.tabs button.borr{color:var(--rosa-ink);font-style:italic}
.aviso{background:var(--rosa);color:var(--rosa-ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;margin-right:4px}

/* KPIs del mes */
.kpi{min-height:168px;justify-content:space-between;gap:8px}
.kpi .lab{font:800 11px/1.3 "Jakarta";letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.kpi b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(40px,5vw,54px);line-height:.92}
.kpi .foot{font-size:12.5px;font-weight:600;opacity:.85;line-height:1.7}
.kpi.v{background:var(--verde);color:var(--verde-ink)}.kpi.r{background:var(--rosa);color:var(--rosa-ink)}
.kpi.v .chip,.kpi.r .chip{background:rgba(255,255,255,.65);color:inherit}

/* Piezas comunes */
.sec-t{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase}
.nota{font-size:12.5px;color:var(--muted);max-width:62ch;margin-top:4px}
.eyebrow{font:800 10.5px/1.3 "Jakarta";letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block}
.chip{display:inline-flex;align-items:center;font:800 11.5px/1 "Jakarta";padding:4px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.bien{color:var(--up);background:var(--up-bg)}.chip.mal{color:var(--muted);background:#EFECF5}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.tile span{font:800 10px/1.25 "Jakarta";letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:26px;line-height:1}
.tile .chip{align-self:flex-start}
.accion{margin-top:auto;background:var(--soft);border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.45}
.accion span{display:block;font:800 10px "Jakarta";letter-spacing:.1em;text-transform:uppercase;color:var(--azul);margin-bottom:3px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.bar span{display:block;height:100%;transform-origin:left;animation:grow .8s var(--ease) backwards}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px}
.leg i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.leg b{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.leg em{font-style:normal;color:var(--ink);font-weight:800}

/* Publicidad */
.camps{display:flex;flex-direction:column;gap:8px}
.camp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 14px}
.camp .th{width:40px;height:52px;border-radius:8px;object-fit:cover;background:var(--line)}
.camp .dot{width:12px;height:12px;border-radius:4px}
.camp b{display:block;font-weight:800;font-size:13.5px}
.camp small{color:var(--muted);font-size:12px;font-weight:600}
.camp .r{text-align:right}.camp .r b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:22px;line-height:1}
.tend{display:flex;align-items:flex-end;gap:14px;height:120px;padding-top:20px}
.tend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.tend b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:18px;line-height:1}
.tend i{display:block;width:100%;max-width:54px;border-radius:10px 10px 4px 4px;background:var(--azul-s);transform-origin:bottom;animation:up .8s var(--ease) backwards}
.tend .act i{background:var(--azul)}
.tend span{font:800 10.5px "Jakarta";letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Vista previa del anuncio (estilo Instagram) */
.ad{background:var(--azul-bg);color:var(--azul-ink)}
.ad .eyebrow{color:var(--azul-ink);opacity:.7}
.ad .nm{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:20px;text-transform:uppercase;line-height:1.08}
.phone{background:#fff;border-radius:16px;overflow:hidden;color:var(--ink);box-shadow:0 1px 2px rgba(26,22,48,.06)}
.phone .hd{display:flex;align-items:center;gap:8px;padding:9px 11px}
.phone .hd img{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
.phone .hd b{font-size:12.5px;display:block;line-height:1.1}.phone .hd small{font-size:10.5px;color:var(--muted)}
.phone .media{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line)}
.phone .cta{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--azul)}
.phone .cp{padding:9px 11px 12px;font-size:12px;line-height:1.45}
.phone .cp b{font-weight:800}
.phone .cp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gst{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gst b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:24px;line-height:1;display:block}
.gst span{font:800 9.5px "Jakarta";letter-spacing:.08em;text-transform:uppercase;opacity:.75}

/* Contactos */
.cont{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dona{width:128px;height:128px;flex:none;position:relative}
.dona svg{width:100%;height:100%;transform:rotate(-90deg)}
.dona div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dona b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:38px;line-height:1}
.dona span{font:800 9.5px "Jakarta";letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cont-r{display:flex;flex-direction:column;gap:12px;flex:1;min-width:200px}
.row-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.row-hd span{font-weight:700;font-size:13.5px}.row-hd small{color:var(--muted);font-weight:600}
.row-hd b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:22px;line-height:1;margin-left:auto}

/* Google */
.gads{background:var(--azul-bg);color:var(--azul-ink)}
.gads .eyebrow{color:var(--azul-ink);opacity:.7}
.gads .nm{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:20px;text-transform:uppercase;line-height:1.08}
.gads .estado{display:inline-block;margin-top:8px;font:800 10.5px "Jakarta";letter-spacing:.08em;text-transform:uppercase;background:var(--verde);color:var(--verde-ink);padding:4px 10px;border-radius:99px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g4 b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:28px;line-height:1;display:block}
.g4 span{font:800 10px "Jakarta";letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.serp{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.serp .sp{font-size:12.5px;font-weight:700;margin-bottom:6px}
.serp .u2{font-size:12px;color:#4d5156;margin-bottom:6px;word-break:break-all}
.serp h4{margin:0 0 6px;font:500 19px/1.3 Arial,sans-serif;color:#1a0dab}
.serp .d{font:13px/1.5 Arial,sans-serif;color:#3c4043}
.serp .l{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font:12.5px Arial,sans-serif;color:#1a0dab}

/* Redes */
.net-hd{display:flex;align-items:center;gap:11px}.net-hd img{width:38px;height:38px}
.net-hd h2{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:20px;text-transform:uppercase}
.hero .lab{font:800 11px "Jakarta";letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.hero .f{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:44px;line-height:1}
.met{display:flex;flex-direction:column;gap:12px}
.comp{display:flex;flex-direction:column;gap:3px}
.comp div{display:flex;align-items:center;gap:8px}
.comp em{font:700 10px "Jakarta";font-style:normal;color:var(--muted);width:28px;flex:none;text-transform:uppercase}
.comp i{display:block;height:8px;border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) backwards}
.comp .a{background:var(--rosa-s)}.comp .h{background:var(--azul)}
.comp{position:relative;cursor:pointer;border-radius:8px;outline-offset:4px}
.comp .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);background:var(--ink);color:#fff;font:600 12px/1.45 "Jakarta";
  padding:8px 11px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:5;box-shadow:0 8px 20px rgba(26,22,48,.25)}
.comp .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.comp .tip b{font-weight:800}.comp .tip .pa{color:var(--rosa-s)}.comp .tip .ph{color:var(--azul-s)}
.comp:hover .tip,.comp:focus .tip{opacity:1;transform:translate(-50%,0)}
.comp:hover i,.comp:focus i{filter:brightness(1.08)}
a.ver{display:inline-flex;align-items:center;gap:4px;font:800 11px "Jakarta";color:var(--azul);text-decoration:none;margin-top:6px}
a.ver:hover{text-decoration:underline}
.rk a.im{display:block;transition:transform .2s var(--ease)}.rk a.im:hover{transform:scale(1.02)}
.rk .im .ico-g{position:absolute;inset:0;display:grid;place-items:center}.rk .im .ico-g img{width:64px;height:64px;opacity:.9}
.spark svg{width:100%;height:54px;display:block}
.spark small{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.winner{border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:flex-start}
.winner img{width:64px;height:84px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.winner p{font-size:13px;margin:4px 0 8px}
.ws{display:flex;gap:14px;flex-wrap:wrap}
.ws b{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:18px;line-height:1;display:block}
.ws span{font:800 9.5px "Jakarta";letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leyenda{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Ranking */
.rank{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.rk{display:flex;flex-direction:column;gap:9px;min-width:0}
.rk .im{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:9/14;background:var(--soft)}
.rk .im>img{width:100%;height:100%;object-fit:cover}
.rk .im .ph{position:absolute;inset:0;display:grid;place-items:center;font:800 11px "Jakarta";color:var(--muted);text-align:center;padding:10px}
.rk .n{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:"Anton",Impact,sans-serif;font-size:18px;box-shadow:0 2px 6px rgba(26,22,48,.18)}
.rk .red{position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 9px 4px 5px;font:800 10.5px "Jakarta"}
.rk .red img{width:18px;height:18px}
.rk p{font-size:12.5px;font-weight:600;line-height:1.35}
.rk small{color:var(--muted);font-size:11.5px;font-weight:600}
@media (max-width:1000px){.rank{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.rank{grid-template-columns:repeat(2,1fr)}}

/* Planeación y cierre */
.plan{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;text-decoration:none;color:var(--azul-ink);background:var(--azul-bg)}
.plan h2{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.05}
.plan p{font-size:12.5px;opacity:.82;max-width:56ch;margin-top:4px}
.plan .go{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;background:#fff;color:var(--azul);border-radius:99px;padding:11px 18px;white-space:nowrap;transition:transform .24s var(--ease)}
.plan:hover .go{transform:translateX(4px)}
.cierre{background:var(--rosa);border-radius:var(--r);padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.cierre img{width:64px;height:64px}
.cierre p{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(24px,4.2vw,40px);text-transform:uppercase;line-height:1.04;color:var(--rosa-ink);max-width:20ch;text-wrap:balance}
.cierre small{font-size:12px;color:var(--rosa-ink);opacity:.8;font-weight:600}
@media print{body{background:#fff}.tabs,.plan{display:none}.card{box-shadow:none;border:1px solid var(--line)}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="id"><img src="assets/img/logo-seal.png" alt="SEAL Servicios Internacionales">
      <div><h1 class="disp">Resultados en redes</h1><span class="sub" id="sub">SEAL Servicios Internacionales</span></div></div>
    <nav class="tabs" role="tablist" aria-label="Mes del reporte" id="meses"></nav>
  </header>
  <main class="grid anim" id="reporte" aria-live="polite"></main>
</div>

<script>
/* Motor del reporte. Los datos de cada mes viven en datos/AAAA-MM.js y se registran
   con REPORTE.agregar({...}). Para publicar un mes nuevo no hace falta tocar nada de aquí. */
var REPORTE = { meses: [], agregar: function (m) { this.meses.push(m); } };
</script>

<!-- ===== MESES: agrega aquí una línea por cada mes nuevo ===== -->
<script src="datos/2026-06.js"></script>
<script src="datos/2026-07.js"></script>
<script src="datos/2026-08.js"></script>
<script src="datos/2026-09.js"></script>
<!-- ============================================================ -->

<script>
(function () {
  const NOTION = "https://app.notion.com/p/freepi-marketing/SEAL-Internacional-1040443fa7e78178bcefc003acf53279?source=copy_link";
  const BORRADOR = /[?&]borrador/.test(location.search);

  const REDES = {
    facebook:  { nombre: "Facebook",  ico: "assets/img/ico-facebook.png",  tono: "#0B5FAE",
                 principal: "visualizaciones", orden: ["espectadores", "interacciones", "clics_enlace", "visitas_perfil", "visitas_pagina", "seguidores_nuevos"] },
    instagram: { nombre: "Instagram", ico: "assets/img/ico-instagram.png", tono: "#C9227D",
                 principal: "alcance", orden: ["visualizaciones", "interacciones", "clics_enlace", "visitas_perfil", "seguidores_nuevos"] },
    tiktok:    { nombre: "TikTok",    ico: "assets/img/ico-tiktok.png",    tono: "#2A5E1C",
                 principal: "visualizaciones", orden: ["alcance", "espectadores", "espectadores_nuevos", "me_gusta", "comentarios", "compartidos", "visitas_perfil"] }
  };
  const ETIQ = {
    visualizaciones: "Visualizaciones", espectadores: "Espectadores", interacciones: "Interacciones", alcance: "Alcance",
    seguidores_nuevos: "Seguidores nuevos", me_gusta: "Me gusta", visitas_perfil: "Visitas al perfil", visitas_pagina: "Visitas a la página",
    clics_enlace: "Clics en el enlace", comentarios: "Comentarios", compartidos: "Veces compartido", espectadores_nuevos: "Espectadores nuevos"
  };
  const TIPOS = {
    captacion:   { nombre: "Captación de clientes", color: "var(--azul)" },
    crecimiento: { nombre: "Crecimiento de redes",  color: "var(--rosa-s)" },
    trafico:     { nombre: "Visitas al sitio",      color: "var(--verde-s)" }
  };
  const PALETA = ["var(--azul-s)", "var(--verde-s)", "var(--rosa-s)", "#D8D4E2"];
  const PAUTA = { // métricas de anuncios que se muestran (sin inversión ni costo por lead)
    leads: "Leads", impresiones: "Impresiones", clics: "Clics en el enlace", interacciones: "Interacciones con anuncios", reproducciones: "Reproducciones de video"
  };

  /* ---------- Formatos ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = v => v == null ? "—" : v >= 1000 ? (Math.round(v / 100) / 10).toLocaleString("es-MX", { maximumFractionDigits: 1 }) + " mil" : Math.round(v).toLocaleString("es-MX");
  const big = (v, mas) => esc((mas ? "+" : "") + num(v)).replace(/ mil$/, '<small class="u"> mil</small>');
  const dinero = (v, d) => "$" + v.toLocaleString("es-MX", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  function chip(c) {
    if (c == null || !isFinite(c)) return "";
    const t = Math.abs(c) >= 1000 ? "×" + Math.round(c / 100 + 1) : Math.abs(c).toFixed(1) + "%";
    return `<span class="chip ${c > 0 ? "bien" : "mal"}">${c >= 0 ? "▲" : "▼"} ${t}</span>`;
  }
  const val = x => x == null ? null : (typeof x === "object" ? x.v : x);
  const pct = (cur, prev) => cur == null || prev == null || prev === 0 ? null : (cur - prev) / prev * 100;
  const exacto = (v, aprox) => (aprox ? "≈ " : "") + Math.round(v).toLocaleString("es-MX");
  const mesLargo = mm => mm ? mm.nombre.split(" ")[0] : "Mes anterior";
  function difTxt(v, p, c) { const d = Math.round(v - p); return `${d >= 0 ? "+" : "−"}${Math.abs(d).toLocaleString("es-MX")} (${c >= 0 ? "+" : "−"}${Math.abs(c).toFixed(1)}%)`; }
  const ver = (u, red) => u ? `<a class="ver" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ver en ${red} <span aria-hidden="true">↗</span></a>` : "";
  const accion = t => t ? `<p class="accion"><span>Siguiente paso</span>${esc(t)}</p>` : "";

  /* ---------- Lectura de métricas ---------- */
  function pauta(m) {
    const P = m && m.pauta; if (!P || !P.campanas) return null;
    let leads = 0; P.campanas.forEach(k => { if (k.tipo === "captacion") leads += k.resultado; });
    return Object.assign({ leads }, P.totales || {});
  }
  function red(m, prev, r, k) { // {v, cambio, prev}
    const x = ((m.redes || {})[r] || {})[k]; if (x == null) return null;
    const v = val(x), exp = typeof x === "object" && x.cambio != null;
    // Si la plataforma dio su %, el mes anterior sale de ese % para que barra y % coincidan
    const pv = exp ? v / (1 + x.cambio / 100) : val((((prev || {}).redes || {})[r] || {})[k]);
    return { v, prev: pv, aprox: exp, cambio: exp ? x.cambio : pct(v, pv) };
  }
  function nuevos(m, prev) {
    const f = red(m, prev, "facebook", "seguidores_nuevos"), i = red(m, prev, "instagram", "seguidores_nuevos");
    if (!f && !i) return null;
    const v = (f ? f.v : 0) + (i ? i.v : 0), p = (f && f.prev != null ? f.prev : 0) + (i && i.prev != null ? i.prev : 0);
    return { v, cambio: pct(v, p || null), f, i };
  }
  function contactos(m) {
    const C = m && m.contactos; if (!C) return null;
    let org = 0, pag = 0; ["facebook", "instagram"].forEach(r => { if (C[r]) { org += C[r].organicos; pag += C[r].pagados; } });
    return { total: org + pag, org, pag };
  }
  // KPI por ruta: "contactos.total", "pauta.<leads|impresiones|clics|...>", "comunidad.nuevos", "google.clics", "redes.<red>.<métrica>"
  function kpi(m, prev, ruta) {
    const p = ruta.split(".");
    if (p[0] === "contactos") { const c = contactos(m), cp = contactos(prev); if (!c) return null;
      const C = m.contactos, t = r => C[r] ? C[r].organicos + C[r].pagados : 0;
      return { v: c.total, cambio: pct(c.total, cp && cp.total), lab: "Contactos generados", foot: `Facebook ${t("facebook")} · Instagram ${t("instagram")}` }; }
    if (p[0] === "pauta") { const a = pauta(m), b = pauta(prev); if (!a || a[p[1]] == null) return null;
      return { v: a[p[1]], cambio: pct(a[p[1]], b && b[p[1]]), lab: PAUTA[p[1]] + " por pauta" }; }
    if (p[0] === "comunidad") { const n = nuevos(m, prev); if (!n) return null;
      return { v: n.v, mas: true, cambio: n.cambio, lab: "Seguidores nuevos FB + IG", foot: `Instagram +${n.i ? n.i.v : 0} · Facebook +${n.f ? n.f.v : 0}` }; }
    if (p[0] === "google") { const G = m.google_ads; if (!G) return null;
      return { v: G[p[1]], lab: p[1] === "clics" ? "Clics en Google Ads" : "Impresiones en Google Ads", foot: `% de clic ${G.ctr.toFixed(2)}%` }; }
    if (p[0] === "redes") { const x = red(m, prev, p[1], p[2]); if (!x) return null;
      return { v: x.v, mas: p[2] === "seguidores_nuevos", cambio: x.cambio, lab: `${ETIQ[p[2]]} ${REDES[p[1]].nombre}` }; }
    return null;
  }

  /* ---------- Secciones ---------- */
  function kpis(m, prev) {
    const rutas = m.kpis || ["contactos.total", "pauta.leads", "comunidad.nuevos", "redes.facebook.espectadores"];
    const cls = ["v", "r", "", ""], mesA = prev ? prev.nombre.split(" ")[0].toLowerCase() : "";
    return rutas.map((r, i) => { const x = kpi(m, prev, r); if (!x) return "";
      const vs = x.cambio != null ? `${chip(x.cambio)} vs. ${esc(mesA)}` : "";
      const pie = [x.foot ? esc(x.foot) : "", vs].filter(Boolean).join("<br>");
      return `<article class="card kpi ${cls[i]} s3"><span class="lab">${esc(x.lab)}</span><b class="num">${big(x.v, x.mas)}</b><span class="foot">${pie}</span></article>`;
    }).join("");
  }

  function seccionPauta(m, prev, hist) {
    const a = pauta(m); if (!a) return "";
    const P = m.pauta, b = pauta(prev);
    const tiles = Object.keys(PAUTA).filter(k => a[k] != null).map(k =>
      `<div class="tile"><span>${PAUTA[k]}</span><b class="num">${big(a[k])}</b>${chip(pct(a[k], b && b[k]))}</div>`).join("");
    const inv = P.campanas.reduce((s, k) => s + (k.inversion || 0), 0), porTipo = {};
    P.campanas.forEach(k => { porTipo[k.tipo] = (porTipo[k.tipo] || 0) + (k.inversion || 0); });
    let barra = "", legs = "";
    Object.keys(TIPOS).forEach(t => { if (!porTipo[t] || !inv) return; const q = porTipo[t] / inv * 100;
      barra += `<span style="width:${q.toFixed(2)}%;background:${TIPOS[t].color}"></span>`;
      legs += `<i><b style="background:${TIPOS[t].color}"></b>${TIPOS[t].nombre} <em>${Math.round(q)}%</em></i>`; });
    const camps = P.campanas.map(k => `<div class="camp">${k.img ? `<img class="th" src="${esc(k.img)}" alt="" loading="lazy">` : `<i class="dot" style="background:${TIPOS[k.tipo].color}"></i>`}
      <div><b>${esc(k.nombre)}</b><small>${TIPOS[k.tipo].nombre}${k.alcance ? " · alcance " + num(k.alcance) : ""}</small></div>
      <div class="r"><b class="num">${num(k.resultado)}</b><small>${esc(k.unidad || "leads")}</small></div></div>`).join("");
    const hs = hist.filter(h => pauta(h)), max = Math.max(...hs.map(h => pauta(h).leads), 1);
    const tend = hs.map(h => `<div class="${h.id === m.id ? "act" : ""}"><b class="num">${pauta(h).leads}</b><i style="height:${Math.max(4, pauta(h).leads / max * 100)}%"></i><span>${esc(h.corto)}</span></div>`).join("");
    return `<article class="card s8"><div><h2 class="sec-t">Publicidad pagada en Meta</h2>
      <p class="nota">${esc(P.texto || "Resultados de los anuncios en Facebook e Instagram.")}</p></div>
      <div class="tiles">${tiles}</div>
      ${barra ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">¿A qué se destinó la pauta?</span><div class="bar">${barra}</div><div class="leg">${legs}</div></div>` : ""}
      <div class="camps">${camps}</div>
      ${hs.length > 1 ? `<div><span class="eyebrow">Leads por mes</span><div class="tend">${tend}</div></div>` : ""}
      ${accion(P.siguiente_paso)}</article>` + anuncio(P.estrella);
  }

  function anuncio(e) {
    if (!e) return "";
    const st = [["leads", "Leads"], ["alcance", "Alcance"], ["clics", "Clics"]].filter(s => e[s[0]] != null)
      .map(s => `<div><b class="num">${big(e[s[0]])}</b><span>${s[1]}</span></div>`).join("");
    return `<article class="card ad s4"><div><span class="eyebrow">Anuncio estrella · así se ve</span><div class="nm">${esc(e.nombre)}</div></div>
      <div class="phone"><div class="hd"><img src="assets/img/logo-seal.png" alt=""><div><b>seal.internacional</b><small>Publicidad</small></div></div>
        ${e.img ? `<img class="media" src="${esc(e.img)}" alt="Vista previa del anuncio" loading="lazy">` : ""}
        ${e.boton ? `<div class="cta"><span>${esc(e.boton)}</span><span aria-hidden="true">›</span></div>` : ""}
        ${e.titulo || e.copy ? `<p class="cp">${e.titulo ? `<b>${esc(e.titulo)}</b><br>` : ""}${esc(e.copy || "")}</p>` : ""}</div>
      ${e.texto ? `<p style="font-size:12.5px">${esc(e.texto)}</p>` : ""}
      <div class="gst">${st}</div></article>`;
  }

  function seccionContactos(m) {
    const C = m.contactos, c = contactos(m); if (!c) return "";
    const R = 52, L = 2 * Math.PI * R, fo = c.org / c.total * L;
    const filas = ["facebook", "instagram"].filter(r => C[r]).map(r => { const t = C[r].organicos + C[r].pagados;
      return `<div><div class="row-hd"><span>${REDES[r].nombre} ${C[r].nuevos != null ? `<small>· ${C[r].nuevos} nuevos</small>` : ""}</span><b class="num">${t}</b></div>
        <div class="bar"><span style="width:${C[r].pagados / c.total * 100}%;background:var(--azul)"></span><span style="width:${C[r].organicos / c.total * 100}%;background:var(--verde-s)"></span></div></div>`; }).join("");
    return `<article class="card s7"><div><h2 class="sec-t">¿Quién nos escribió?</h2><p class="nota">${esc(C.texto || "")}</p></div>
      <div class="cont"><div class="dona"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--azul)" stroke-width="14"/>
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--verde-s)" stroke-width="14" stroke-dasharray="${fo.toFixed(1)} ${L.toFixed(1)}"/></svg>
        <div><b class="num">${c.total}</b><span>Contactos</span></div></div>
        <div class="cont-r">${filas}<div class="leg"><i><b style="background:var(--azul)"></b>Por anuncios <em>${c.pag}</em></i><i><b style="background:var(--verde-s)"></b>Orgánicos <em>${c.org}</em></i></div></div></div>
      ${accion(C.siguiente_paso)}</article>`;
  }

  function seccionComunidad(m, prev) {
    const n = nuevos(m, prev); if (!n) return "";
    const t1 = [["Instagram", n.i], ["Facebook", n.f]].filter(x => x[1]).map(x => `<div class="tile"><span>${x[0]}</span><b class="num">+${num(x[1].v)}</b>${chip(x[1].cambio)}</div>`).join("")
      + `<div class="tile"><span>Total nuevos</span><b class="num">+${num(n.v)}</b>${chip(n.cambio)}</div>`;
    const ex = (m.comunidad || []).map(e => `<div class="tile"><span>${esc(e[1])}</span><b class="num">${esc(e[0])}</b>${e[2] != null ? chip(e[2]) : ""}</div>`).join("");
    return `<article class="card s5"><div><h2 class="sec-t">Crecimiento de comunidad</h2><p class="nota">Seguidores nuevos del mes en cada red.</p></div>
      <div class="tiles">${t1}</div>${ex ? `<div class="tiles">${ex}</div>` : ""}</article>`;
  }

  function seccionGoogle(m) {
    const G = m.google_ads; if (!G) return "";
    const A = G.anuncio;
    return `<article class="card gads s4"><div><span class="eyebrow">Google Ads · Campaña activa</span><div class="nm">${esc(G.campana)}</div><span class="estado">Activa · Búsqueda</span></div>
      <div class="g4"><div><b class="num">${G.impresiones.toLocaleString("es-MX")}</b><span>Impresiones</span></div><div><b class="num">${G.clics}</b><span>Clics</span></div>
      <div><b class="num">${G.ctr.toFixed(2)}%</b><span>% de clic</span></div><div><b class="num">${dinero(G.cpc, 2)}</b><span>Costo por clic</span></div></div>
      <p style="font-size:12.5px;opacity:.85">${esc(G.texto || "")}</p></article>` +
      (A ? `<article class="card s8"><div><h2 class="sec-t">Así se ve el anuncio en Google</h2><p class="nota">Vista previa del anuncio de búsqueda.</p></div>
      <div class="serp"><div class="sp">Patrocinado</div><div class="u2">${esc(A.url)}</div><h4>${esc(A.titulo)}</h4><p class="d">${esc(A.descripcion)}</p>
      <div class="l">${(A.enlaces || []).map(l => `<span>${esc(l)}</span>`).join("")}</div></div></article>` : "");
  }

  function spark(s, col) {
    const d = s.datos, W = 300, H = 54, p = 4, max = Math.max(...d), n = d.length, k = d.indexOf(max);
    const x = i => i / (n - 1) * W, y = v => H - p - v / max * (H - p * 2);
    const line = d.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" "), id = "g" + Math.random().toString(36).slice(2, 8);
    return `<div class="spark"><svg viewBox="0 0 300 54" preserveAspectRatio="none" role="img" aria-label="${esc(s.etiqueta)}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".26"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>
      <small><span>${esc(s.etiqueta)}</span><span>Pico día ${k + 1} · ${max.toLocaleString("es-MX")}</span></small></div>`;
  }

  function tarjetaRed(r, m, prev) {
    const R = REDES[r], d = (m.redes || {})[r]; if (!d) return "";
    const pm = red(m, prev, r, R.principal), mA = prev ? prev.corto : "Ant.";
    const filas = R.orden.map(k => { const x = red(m, prev, r, k); if (!x) return "";
      const mx = Math.max(x.v, x.prev || 0) || 1, mas = k === "seguidores_nuevos" ? "+" : "";
      return `<div><div class="row-hd"><span>${ETIQ[k]}</span><b class="num">${mas}${num(x.v)}</b>${chip(x.cambio)}</div>
        ${x.prev != null ? `<div class="comp" tabindex="0" aria-label="${ETIQ[k]}: ${esc(mA)} ${exacto(x.prev, x.aprox)}, ${esc(m.corto)} ${exacto(x.v)}"><span class="tip" role="tooltip"><span class="pa">${esc(mesLargo(prev))}:</span> <b>${mas}${exacto(x.prev, x.aprox)}</b><br><span class="ph">${esc(mesLargo(m))}:</span> <b>${mas}${exacto(x.v)}</b><br>${difTxt(x.v, x.prev, x.cambio)}</span>
          <div><em>${esc(mA)}</em><i class="a" style="width:${(x.prev / mx * 100).toFixed(1)}%"></i></div><div><em>${esc(m.corto)}</em><i class="h" style="width:${(x.v / mx * 100).toFixed(1)}%"></i></div></div>` : ""}</div>`; }).join("");
    const rp = d.reparto, g = d.ganador;
    return `<article class="card s4"><header class="net-hd"><img src="${R.ico}" alt=""><h2>${R.nombre}</h2></header>
      ${pm ? `<div class="hero"><span class="lab">${ETIQ[R.principal]} en ${esc(m.nombre.split(" ")[0].toLowerCase())}</span><div class="f"><b class="num">${big(pm.v)}</b>${chip(pm.cambio)}</div></div>` : ""}
      ${d.serie ? spark(d.serie, R.tono) : ""}
      ${rp ? `<div style="display:flex;flex-direction:column;gap:7px"><span class="eyebrow">${esc(rp.titulo)}</span><div class="bar">${rp.partes.map((q, j) => `<span style="width:${q[1]}%;background:${PALETA[j % 4]}"></span>`).join("")}</div>
        <div class="leg">${rp.partes.map((q, j) => `<i><b style="background:${PALETA[j % 4]}"></b>${esc(q[0])} <em>${esc(q[2] || q[1] + "%")}</em></i>`).join("")}</div></div>` : ""}
      <div class="met">${filas}</div>
      ${g ? `<div class="winner">${g.img ? (g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer" aria-label="Ver publicación original"><img src="${esc(g.img)}" alt="" loading="lazy"></a>` : `<img src="${esc(g.img)}" alt="" loading="lazy">`) : ""}<div><span class="eyebrow">Contenido ganador</span><p>${esc(g.texto)}</p>
        <div class="ws">${g.stats.map(s => `<div><b class="num">${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>${ver(g.url, R.nombre)}</div></div>` : ""}
      ${accion(d.siguiente_paso)}</article>`;
  }

  function seccionRanking(m) {
    const T = m.top; if (!T || !T.length) return "";
    const cards = T.map((t, i) => { const tag = t.url ? "a" : "div", at = t.url ? ` href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" aria-label="Ver publicación original #${i + 1}"` : "";
      return `<div class="rk"><${tag} class="im"${at}>${t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy">` : `<span class="ico-g"><img src="${REDES[t.red].ico}" alt=""></span>`}
        <span class="n">${i + 1}</span><span class="red"><img src="${REDES[t.red].ico}" alt="">${REDES[t.red].nombre}</span></${tag}>
      <p>${esc(t.titulo)}</p><small>${esc(t.fecha)} · ${esc(t.stats)}</small>${ver(t.url, REDES[t.red].nombre)}</div>`; }).join("");
    return `<article class="card s12"><div><h2 class="sec-t">Mejores contenidos del mes</h2><p class="nota">${esc(m.top_nota || "Contenido publicado en el mes, ordenado por visualizaciones.")}</p></div>
      <div class="rank">${cards}</div></article>`;
  }

  /* ---------- Página ---------- */
  const visibles = REPORTE.meses.filter(m => !m.oculto && (!m.borrador || BORRADOR)).sort((a, b) => a.id < b.id ? 1 : -1);
  const todos = REPORTE.meses.slice().sort((a, b) => a.id < b.id ? -1 : 1);

  function render(id) {
    const m = visibles.find(x => x.id === id) || visibles[0];
    const i = todos.indexOf(m), prev = i > 0 ? todos[i - 1] : null;
    const hist = todos.filter(h => h.id <= m.id && !(h.borrador && !BORRADOR)).slice(-6);
    document.title = "Reporte SEAL — Redes Sociales · " + m.nombre;
    document.getElementById("sub").innerHTML = (m.borrador ? '<span class="aviso">Borrador</span>' : "") + esc(m.conclusion || "SEAL Servicios Internacionales");
    document.querySelectorAll("#meses button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === m.id ? "true" : "false"));
    const g = document.getElementById("reporte");
    g.innerHTML = kpis(m, prev) + seccionPauta(m, prev, hist) + seccionContactos(m) + seccionComunidad(m, prev) + seccionGoogle(m) +
      `<div class="s12 leyenda" style="justify-content:flex-end"><span><i style="background:var(--rosa-s)"></i>Mes anterior</span><span><i style="background:var(--azul)"></i>Este mes</span></div>` +
      Object.keys(REDES).map(r => tarjetaRed(r, m, prev)).join("") + seccionRanking(m) +
      `<a class="card plan s12" href="${NOTION}" target="_blank" rel="noopener noreferrer"><div><span class="eyebrow" style="color:var(--azul-ink);opacity:.65">Planeación del mes</span>
        <h2>Calendario de contenido en Notion</h2><p>Piezas programadas, guiones y estados de publicación del mes, con el detalle de cada campaña.</p></div>
        <span class="go">Abrir en Notion <span aria-hidden="true">↗</span></span></a>
      <div class="cierre s12"><img src="assets/img/logo-seal.png" alt=""><p>Estamos encantados de seguir sumando</p>
        <small>SEAL Servicios Internacionales · Reporte de redes sociales, ${esc(m.nombre.toLowerCase())}</small></div>`;
    g.classList.remove("anim"); void g.offsetWidth; g.classList.add("anim");
  }

  const nav = document.getElementById("meses");
  nav.innerHTML = visibles.map(m => `<button role="tab" data-id="${m.id}"${m.borrador ? ' class="borr"' : ""}>${esc(m.nombre)}${m.borrador ? " · borrador" : ""}</button>`).join("");
  const btns = [...nav.querySelectorAll("button")];
  btns.forEach((b, i) => {
    b.addEventListener("click", () => { history.replaceState(null, "", location.search + "#" + b.dataset.id); render(b.dataset.id); });
    b.addEventListener("keydown", e => { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; e.preventDefault();
      const n = btns[(i + (e.key === "ArrowRight" ? 1 : btns.length - 1)) % btns.length]; n.focus(); n.click(); });
  });
  addEventListener("hashchange", () => render(location.hash.slice(1)));
  render(location.hash.slice(1));
})();
</script>
</body>
</html>
